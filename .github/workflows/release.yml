# Release: runs for a pushed tag of the form vMAJOR.MINOR.PATCH and nothing
# else. Pushing the tag is the publish step for a Go module; this workflow
# checks the tagged commit, creates the GitHub Release, asks the module proxy
# to index the version, and publishes the docs site.
#
# The tag filter below is a glob, so the validate job repeats the check with a
# strict regular expression and every later job depends on it.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MODULE: github.com/nayan9229/jsonflat

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Tag is vMAJOR.MINOR.PATCH and matches the module's major version
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/validate-tag.sh "$TAG" go.mod
      - name: Tag points at a commit on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_SHA is not on $DEFAULT_BRANCH; release only from the default branch"
            exit 1
          fi
      - name: CHANGELOG.md has a dated section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/changelog-section.sh "${TAG#v}" CHANGELOG.md > release-notes.md
      - name: go directive is within the tested range
        run: |
          have=$(go mod edit -json | jq -r .Go)
          lowest=$(printf '%s\n1.24\n' "$have" | sort -V | head -n1)
          if [ "$lowest" != "$have" ]; then
            echo "::error::go.mod requires go $have, but the test matrix starts at 1.24"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  lint:
    name: Lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Documentation
        run: scripts/doc-check.sh

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go: "1.24" }
          - { os: ubuntu-latest, go: stable }
          - { os: macos-latest, go: stable }
          - { os: windows-latest, go: stable }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test
        run: go test -count=1 ./...
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -count=1 -race ./...

  bench:
    name: Zero allocations
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Benchmarks must report 0 allocs/op
        run: scripts/check-allocs.sh bench.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench
          path: bench.txt

  fuzz:
    name: Fuzz
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: FuzzAppend
        run: go test -run xxx -fuzz 'FuzzAppend$' -fuzztime 30s .
      - name: FuzzEach
        run: go test -run xxx -fuzz 'FuzzEach$' -fuzztime 30s .

  build:
    name: Build everywhere
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go build
        run: go build ./...
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  release:
    name: GitHub Release and proxy index
    needs: [validate, lint, test, bench, fuzz, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat release-notes.md
            printf '\n## Install\n\n```\ngo get %s@%s\n```\n\nAPI reference: https://pkg.go.dev/%s@%s\n' \
              "$MODULE" "$TAG" "$MODULE" "$TAG"
          } > body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it as it is"
          else
            gh release create "$TAG" --verify-tag --latest --title "jsonflat $TAG" --notes-file body.md
          fi
      - name: Ask the module proxy and the checksum database to index the version
        env:
          TAG: ${{ github.ref_name }}
          GOPROXY: https://proxy.golang.org
          GOFLAGS: -mod=mod
        run: |
          # A module cannot query itself at a version, so ask from a scratch module.
          tmp=$(mktemp -d)
          cd "$tmp" || exit 1
          go mod init warm >/dev/null 2>&1
          for attempt in 1 2 3 4 5 6; do
            if go list -m "$MODULE@$TAG"; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::proxy.golang.org did not serve $MODULE@$TAG"; exit 1; }
            sleep 10
          done
          for attempt in 1 2 3 4 5 6; do
            if curl -sSf "https://sum.golang.org/lookup/$MODULE@$TAG"; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::sum.golang.org has no entry for $MODULE@$TAG"; exit 1; }
            sleep 10
          done
      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## jsonflat $TAG"
            echo
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
            echo "- API reference: https://pkg.go.dev/$MODULE@$TAG"
            echo "- Install: \`go get $MODULE@$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Publish docs
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the pages that come from the repository
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/docs-sync.sh "$TAG"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
